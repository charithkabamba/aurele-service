{% extends 'base.html' %}
{% load static %}
{% block content %}

<!-- Header Start -->
<div class="container-fluid bg-breadcrumb">
    <div class="container text-center py-5" style="max-width: 900px;">
        <h4 class="text-white display-4 mb-4 wow fadeInDown" data-wow-delay="0.1s">{{ project.title }}</h4>
        <ol class="breadcrumb d-flex justify-content-center mb-0 wow fadeInDown" data-wow-delay="0.3s">
            <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Pages</a></li>
            <li class="breadcrumb-item active text-secondary">{{ project.title }}</li>
        </ol>
    </div>
</div>
<!-- Header End -->

<!-- Project Start -->
<div class="container-fluid py-5">
    <div class="container">
        <div class="row g-5">
            <div class="col-lg-6 wow fadeInUp" data-wow-delay="0.1s">
                <div class="project-img">
                    {% if project.image %}
                    <img src="{{ project.image.url }}" class="img-fluid w-100" alt="{{ project.title }}">
                    {% else %}
                    <img src="{% static 'assets/img/project-1.jpg' %}" class="img-fluid w-100"
                        alt="{{ project.title }}">
                    {% endif %}
                </div>
            </div>
            <div class="col-lg-6 wow fadeInUp" data-wow-delay="0.3s">
                <div class="project-content bg-light p-4">
                    <h4 class="mb-3">{{ project.title }}</h4>
                    <p>{{ project.description }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Project End -->

{% endblock %}
