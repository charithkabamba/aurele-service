{% extends 'base.html' %}

{% load static %}
{% block title %}{{ post.title }} - Blog{% endblock %}
{% block content %}

<div class="container mt-5">
    <div class="row">
        <div class="col-12">
            <h1 class="display-4">{{ post.title }}</h1>
            <p class="text-muted">{{ post.published_at|date:"F j, Y" }} — {{ post.category }}</p>
            {% if post.image %}
            <img src="{{ post.image.url }}" class="img-fluid mb-4" alt="{{ post.title }}">
            {% endif %}
            <div class="mb-4">
                {{ post.content|safe }}
            </div>
            <a class="btn btn-outline-primary" href="{% url 'blog:post_list' %}">Back to Blog</a>
        </div>
    </div>
</div>

{% endblock %}
